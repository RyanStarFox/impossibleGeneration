<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>不可能三角生成器｜三圆叠色梗图</title>
    <meta
      name="description"
      content="免费在线不可能三角生成器：把快、好、便宜那种三圆维恩图做成颜料叠色梗图，改文字换配色，导出透明底 PNG。"
    />
    <link rel="canonical" href="https://tri.ryanstarfox.top/" />
    <link rel="alternate" hreflang="zh-CN" href="https://tri.ryanstarfox.top/" />
    <link rel="alternate" hreflang="en" href="https://tri.ryanstarfox.top/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://tri.ryanstarfox.top/" />
    <meta name="theme-color" content="#EFE9DB" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="不可能三角生成器" />
    <meta property="og:title" content="不可能三角生成器｜三圆叠色梗图" />
    <meta
      property="og:description"
      content="三个圆按颜料叠色，红蓝成紫、黄蓝成绿。改文字、换配色，导出透明底 PNG。"
    />
    <meta property="og:url" content="https://tri.ryanstarfox.top/" />
    <meta property="og:image" content="https://tri.ryanstarfox.top/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="快、便宜、好三圆叠色，中间写着不可能" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="不可能三角生成器｜三圆叠色梗图" />
    <meta
      name="twitter:description"
      content="三个圆按颜料叠色，改文字换配色，导出透明底 PNG 梗图。"
    />
    <meta name="twitter:image" content="https://tri.ryanstarfox.top/og.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "不可能三角生成器",
        "alternateName": "Impossible Triangle Generator",
        "url": "https://tri.ryanstarfox.top/",
        "description": "免费在线不可能三角生成器：三圆按红黄蓝颜料叠色，自定义文字与配色，导出透明底 PNG。",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "inLanguage": ["zh-CN", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
        "image": "https://tri.ryanstarfox.top/og.png"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <a class="skip-link" href="#proof">Skip to diagram</a>

    <header class="masthead">
      <div class="brand">
        <p class="eyebrow" data-i18n="eyebrow">颜料 · 红黄蓝叠色</p>
        <h1>
          <span class="title-primary" data-i18n="title">不可能三角生成器</span>
          <span class="title-secondary" data-i18n="titleAlt">Impossible Triangle</span>
        </h1>
        <p class="lede" data-i18n="lede">
          三个愿望叠在一起，中间那个就是梗。按颜料混合，导出 PNG。
        </p>
      </div>
      <div class="mast-actions">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" class="seg-btn" data-lang="zh" aria-pressed="false">中</button>
          <button type="button" class="seg-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="bench">
      <section class="proof" id="proof">
        <div class="sheet" data-bg="solid">
          <span class="crop tl" aria-hidden="true"></span>
          <span class="crop tr" aria-hidden="true"></span>
          <span class="crop bl" aria-hidden="true"></span>
          <span class="crop br" aria-hidden="true"></span>
          <span class="reg-mark" aria-hidden="true"></span>
          <div class="stage">
            <canvas id="venn" width="1000" height="1000" aria-label="Impossible triangle preview"></canvas>
          </div>
        </div>
        <div class="export-row">
          <button type="button" class="btn-press" id="download">
            <span data-i18n="download">下载 PNG</span>
          </button>
          <p class="hint" data-i18n="exportHint">预览即成图。透明底会保留圆外的透明像素。</p>
        </div>
      </section>

      <aside class="ticket" aria-label="Controls">
        <form id="controls" onsubmit="return false">
          <fieldset>
            <legend data-i18n="copyLegend">文字</legend>
            <div class="venn-fields">
              <label class="field area-top">
                <span data-i18n="labelTop">上圆</span>
                <textarea id="text-top" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
              <label class="field area-ab">
                <span data-i18n="labelAB">上 ∩ 左</span>
                <textarea id="text-ab" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
              <label class="field area-center">
                <span data-i18n="labelCenter">三圆交汇</span>
                <textarea id="text-center" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
              <label class="field area-ac">
                <span data-i18n="labelAC">上 ∩ 右</span>
                <textarea id="text-ac" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
              <label class="field area-left">
                <span data-i18n="labelLeft">左圆</span>
                <textarea id="text-left" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
              <label class="field area-bc">
                <span data-i18n="labelBC">左 ∩ 右</span>
                <textarea id="text-bc" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
              <label class="field area-right">
                <span data-i18n="labelRight">右圆</span>
                <textarea id="text-right" rows="1" maxlength="80" autocomplete="off"></textarea>
              </label>
            </div>
            <div class="row">
              <label class="field grow">
                <span data-i18n="fontSizeCenter">三重叠字号</span>
                <input type="range" id="font-size-center" min="18" max="56" value="32" />
              </label>
              <label class="field grow">
                <span data-i18n="fontSizeOverlap">二重叠字号</span>
                <input type="range" id="font-size-overlap" min="18" max="56" value="32" />
              </label>
            </div>
            <div class="row">
              <label class="field grow">
                <span data-i18n="fontSizeExclusive">不重叠字号</span>
                <input type="range" id="font-size-exclusive" min="18" max="56" value="32" />
              </label>
              <label class="field color-field">
                <span data-i18n="labelColor">文字颜色</span>
                <span class="swatch-wrap">
                  <input type="color" id="label-color" value="#1C1714" />
                  <input type="text" id="label-color-hex" class="hex" spellcheck="false" value="#1C1714" />
                </span>
              </label>
            </div>
            <div class="row">
              <label class="field grow">
                <span data-i18n="overlapDist">重叠文字到中心</span>
                <input type="range" id="overlap-dist" min="12" max="112" value="46" />
              </label>
              <label class="field grow">
                <span data-i18n="exclusiveRatio">独占文字到中心</span>
                <input type="range" id="exclusive-ratio" min="40" max="92" value="66" />
              </label>
            </div>
            <label class="check">
              <input type="checkbox" id="auto-contrast" checked />
              <span data-i18n="autoContrast">按叠色自动黑白字</span>
            </label>
          </fieldset>

          <fieldset>
            <legend data-i18n="inkLegend">油墨</legend>
            <div class="presets" role="group" aria-label="Color presets">
              <button type="button" class="preset-btn is-active" data-preset="morandi">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#C46B6B"></i>
                  <i style="background:#D4C07A"></i>
                  <i style="background:#6B8FA8"></i>
                </span>
                <span data-i18n="presetMorandi">莫兰迪</span>
              </button>
              <button type="button" class="preset-btn" data-preset="standard">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#FF0000"></i>
                  <i style="background:#FFFF00"></i>
                  <i style="background:#0000FF"></i>
                </span>
                <span data-i18n="presetStandard">标准红黄蓝</span>
              </button>
              <button type="button" class="preset-btn" data-preset="pastel">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#E8A4A1"></i>
                  <i style="background:#E6D18A"></i>
                  <i style="background:#9BB8D4"></i>
                </span>
                <span data-i18n="presetPastel">马卡龙</span>
              </button>
              <button type="button" class="preset-btn" data-preset="ukiyo">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#C44536"></i>
                  <i style="background:#E2B13C"></i>
                  <i style="background:#2F4A78"></i>
                </span>
                <span data-i18n="presetUkiyo">浮世绘</span>
              </button>
              <button type="button" class="preset-btn" data-preset="sunset">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#E85D4C"></i>
                  <i style="background:#F0B429"></i>
                  <i style="background:#4A5D8A"></i>
                </span>
                <span data-i18n="presetSunset">晚霞</span>
              </button>
              <button type="button" class="preset-btn" data-preset="pop">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#F03A47"></i>
                  <i style="background:#FFD23F"></i>
                  <i style="background:#2D5BE3"></i>
                </span>
                <span data-i18n="presetPop">波普</span>
              </button>
              <button type="button" class="preset-btn" data-preset="tea">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#B85C38"></i>
                  <i style="background:#C9B56A"></i>
                  <i style="background:#4F7A8C"></i>
                </span>
                <span data-i18n="presetTea">草木</span>
              </button>
              <button type="button" class="preset-btn" data-preset="candy">
                <span class="preset-dots" aria-hidden="true">
                  <i style="background:#FF6B9D"></i>
                  <i style="background:#FFE566"></i>
                  <i style="background:#6EC6FF"></i>
                </span>
                <span data-i18n="presetCandy">糖果</span>
              </button>
            </div>
            <div class="ink-grid">
              <label class="field color-field">
                <span data-i18n="colorTop">上圆颜色</span>
                <span class="swatch-wrap">
                  <input type="color" id="color-top" value="#C46B6B" />
                  <input type="text" id="color-top-hex" class="hex" spellcheck="false" value="#C46B6B" />
                </span>
              </label>
              <label class="field color-field">
                <span data-i18n="colorLeft">左圆颜色</span>
                <span class="swatch-wrap">
                  <input type="color" id="color-left" value="#6B8FA8" />
                  <input type="text" id="color-left-hex" class="hex" spellcheck="false" value="#6B8FA8" />
                </span>
              </label>
              <label class="field color-field">
                <span data-i18n="colorRight">右圆颜色</span>
                <span class="swatch-wrap">
                  <input type="color" id="color-right" value="#D4C07A" />
                  <input type="text" id="color-right-hex" class="hex" spellcheck="false" value="#D4C07A" />
                </span>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="plateLegend">印版</legend>
            <label class="check">
              <input type="checkbox" id="stroke-enabled" />
              <span data-i18n="strokeEnabled">圆圈描边</span>
            </label>
            <div class="row stroke-controls" hidden>
              <label class="field color-field">
                <span data-i18n="strokeColor">描边颜色</span>
                <span class="swatch-wrap">
                  <input type="color" id="stroke-color" value="#1C1714" />
                  <input type="text" id="stroke-color-hex" class="hex" spellcheck="false" value="#1C1714" />
                </span>
              </label>
              <label class="field grow">
                <span data-i18n="strokeWidth">描边粗细</span>
                <input type="range" id="stroke-width" min="1" max="16" value="4" />
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="stockLegend">纸张</legend>
            <div class="seg stock-seg" role="radiogroup" aria-label="Background">
              <label class="seg-btn">
                <input type="radio" name="bg-mode" value="white" />
                <span data-i18n="bgWhite">白底</span>
              </label>
              <label class="seg-btn">
                <input type="radio" name="bg-mode" value="transparent" checked />
                <span data-i18n="bgTransparent">透明底</span>
              </label>
              <label class="seg-btn">
                <input type="radio" name="bg-mode" value="custom" />
                <span data-i18n="bgCustom">自定义</span>
              </label>
            </div>
            <label class="field color-field bg-custom-field" hidden>
              <span data-i18n="bgColor">背景颜色</span>
              <span class="swatch-wrap">
                <input type="color" id="bg-color" value="#FFFFFF" />
                <input type="text" id="bg-color-hex" class="hex" spellcheck="false" value="#FFFFFF" />
              </span>
            </label>
          </fieldset>
        </form>
      </aside>
    </main>

    <footer class="colophon">
      <p data-i18n="footer">叠色方式：颜料混合。红+蓝=紫，蓝+黄=绿，黄+红=橙。</p>
      <a
        class="repo-link"
        href="https://github.com/RyanStarFox/impossibleGeneration"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="repoLink"
      >GitHub 源码</a>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
